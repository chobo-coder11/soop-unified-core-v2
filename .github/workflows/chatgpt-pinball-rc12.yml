name: ChatGPT Pinball RC14 Build

on:
  push:
    branches:
      - tmp-pinball-rc12-build
    paths:
      - '.chatgpt-build/pinball-rc12/**'
      - '.github/workflows/chatgpt-pinball-rc12.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.chatgpt-build/pinball-rc12/**'
      - '.github/workflows/chatgpt-pinball-rc12.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'

      - name: Reconstruct and patch source
        shell: pwsh
        run: |
          $parts = Get-ChildItem '.chatgpt-build/pinball-rc12/part*.txt' | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\pinball-rc12-source.zip", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\pinball" | Out-Null
          Expand-Archive "$env:RUNNER_TEMP\pinball-rc12-source.zip" "$env:RUNNER_TEMP\pinball" -Force

          # Replace the damaged rc12 UI script, then repair the one known mangled line before syntax validation.
          Copy-Item '.chatgpt-build/pinball-rc12/appfix.js' "$env:RUNNER_TEMP\pinball\ui\app.js" -Force
          $uiHash = (Get-FileHash "$env:RUNNER_TEMP\pinball\ui\app.js" -Algorithm SHA256).Hash.ToLower()
          if ($uiHash -ne '71154adeb60bbf9febfafa31404893fad858aae6ffb864013f23562b5a8f8a76') { throw "UI asset checksum mismatch: $uiHash" }
          $appPath = "$env:RUNNER_TEMP\pinball\ui\app.js"
          $appLines = [System.Collections.Generic.List[string]](Get-Content $appPath)
          if ($appLines.Count -lt 46) { throw 'UI script is unexpectedly short' }
          $fixedLine = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(''))
          $appLines[45] = $fixedLine.TrimEnd("`r","`n")
          Set-Content $appPath $appLines -Encoding utf8

          # rc14: give PINBALL QUEUE substantially more room without adding controls.
          $stylePath = "$env:RUNNER_TEMP\pinball\ui\style.css"
          $css = Get-Content $stylePath -Raw
          $css = $css.Replace('.workspace{min-height:0;display:grid;grid-template-columns:292px minmax(600px,1fr) 420px;gap:12px;padding:12px}', '.workspace{min-height:0;display:grid;grid-template-columns:280px minmax(520px,1fr) minmax(520px,34vw);gap:12px;padding:12px}')
          $css = $css.Replace('body.compact .leftRail{display:none}body.compact .workspace{grid-template-columns:minmax(560px,1fr) 440px}', 'body.compact .leftRail{display:none}body.compact .workspace{grid-template-columns:minmax(520px,1fr) minmax(540px,38vw)}')
          $css = $css.Replace('@media(max-width:1500px){.topbar{grid-template-columns:268px minmax(280px,1fr) auto auto}.workspace{grid-template-columns:268px minmax(520px,1fr) 380px}', '@media(max-width:1500px){.topbar{grid-template-columns:260px minmax(280px,1fr) auto auto}.workspace{grid-template-columns:260px minmax(470px,1fr) 500px}')
          $css = $css.Replace('@media(max-width:1250px){body{min-width:1024px}.workspace{grid-template-columns:245px minmax(440px,1fr) 340px;gap:8px;padding:8px}.topbar{grid-template-columns:245px minmax(240px,1fr) auto}', '@media(max-width:1250px){body{min-width:1040px}.workspace{grid-template-columns:230px minmax(390px,1fr) 390px;gap:8px;padding:8px}.topbar{grid-template-columns:230px minmax(240px,1fr) auto}')
          $css = $css.Replace('.queueHeader{display:flex;justify-content:space-between;align-items:center;padding:15px 14px 12px}', '.queueHeader{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 16px 13px}')
          $css = $css.Replace('.queueList{min-height:0;overflow:auto;padding:8px}', '.queueList{min-height:0;overflow:auto;padding:10px 11px}')
          $css = $css.Replace('.queueItem{border:1px solid #1f2730;border-radius:11px;background:#10161c;padding:11px;margin-bottom:7px;transition:.15s}', '.queueItem{border:1px solid #1f2730;border-radius:12px;background:#10161c;padding:12px 13px;margin-bottom:8px;transition:.15s}')
          $css = $css.Replace('.queueOutput{font-size:12px;font-weight:800;', '.queueOutput{font-size:13px;font-weight:800;')
          $css = $css.Replace('.copyDock{padding:11px 12px 12px;', '.copyDock{padding:12px 14px 14px;')
          Set-Content $stylePath $css -NoNewline -Encoding utf8
          if ($css -notmatch 'grid-template-columns:280px minmax\(520px,1fr\) minmax\(520px,34vw\)') { throw 'Queue width patch did not apply' }

          $mainPath = "$env:RUNNER_TEMP\pinball\main.go"
          (Get-Content $mainPath -Raw).Replace('1.0.0-rc12','1.0.0-rc14') | Set-Content $mainPath -NoNewline -Encoding utf8
          $indexPath = "$env:RUNNER_TEMP\pinball\ui\index.html"
          (Get-Content $indexPath -Raw).Replace('1.0.0-rc12','1.0.0-rc14') | Set-Content $indexPath -NoNewline -Encoding utf8
          $readmePath = "$env:RUNNER_TEMP\pinball\README.txt"
          $readme = (Get-Content $readmePath -Raw).Replace('v1.0.0-rc12','v1.0.0-rc14')
          $readme = "RC14 — Wider PINBALL QUEUE`r`n- Queue 기본 폭 확대: 큰 화면 약 34vw / 1500px급 500px / 작은 화면 390px`r`n- Queue 카드와 복사 영역 가독성 개선`r`n`r`n" + $readme
          Set-Content $readmePath $readme -NoNewline -Encoding utf8

      - name: Validate UI syntax
        shell: pwsh
        working-directory: ${{ runner.temp }}\pinball
        run: |
          node --check ui/app.js
          if (Select-String -Path ui/app.js -Pattern '�' -Quiet) { throw 'Corrupted replacement characters found in ui/app.js' }
          if (-not (Select-String -Path ui/style.css -SimpleMatch 'minmax(520px,34vw)' -Quiet)) { throw 'Wider queue CSS missing' }

      - name: Pin dependency
        shell: pwsh
        working-directory: ${{ runner.temp }}\pinball
        run: |
          go get github.com/jchv/go-webview2@v0.0.0-20260205173254-56598839c808
          go mod tidy

      - name: Unit tests
        shell: pwsh
        working-directory: ${{ runner.temp }}\pinball
        run: |
          go test ./...
          go vet ./...

      - name: Build Windows GUI
        shell: pwsh
        working-directory: ${{ runner.temp }}\pinball
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags='-s -w -H=windowsgui' -o 'SOOP Pinball Collector by BWK.exe' .
          if (-not (Test-Path 'SOOP Pinball Collector by BWK.exe')) { throw 'EXE build failed' }

      - name: Package verified deliverables
        shell: pwsh
        working-directory: ${{ runner.temp }}\pinball
        run: |
          $out = "$env:RUNNER_TEMP\deliverables"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item 'SOOP Pinball Collector by BWK.exe' "$out\SOOP Pinball Collector by BWK.exe"
          Copy-Item 'README.txt' "$out\SOOP Pinball Collector by BWK - README.txt"
          $hash = (Get-FileHash 'SOOP Pinball Collector by BWK.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  SOOP Pinball Collector by BWK.exe" | Set-Content "$out\SOOP Pinball Collector by BWK.sha256.txt" -Encoding ascii
          Remove-Item 'SOOP Pinball Collector by BWK.exe'
          Compress-Archive -Path * -DestinationPath "$out\SOOP Pinball Collector by BWK - Source.zip" -CompressionLevel Optimal
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: soop-pinball-collector-rc14
          path: ${{ runner.temp }}\deliverables\*
          if-no-files-found: error
          retention-days: 1
