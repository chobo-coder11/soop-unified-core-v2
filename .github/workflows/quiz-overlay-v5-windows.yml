name: Build SOOP Quiz Overlay v0.5 EXE

on:
  push:
    branches: [feature/quiz-overlay-draft]
    paths:
      - 'quiz-overlay/**'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/quiz-overlay-v5-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-v5:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build bundled Unified Core
        shell: pwsh
        run: |
          npm install --no-package-lock
          npm run build
          npm prune --omit=dev --no-package-lock

      - name: Smoke Core HTTP and WebSocket v4 heartbeat
        shell: pwsh
        run: |
          $env:HOST='127.0.0.1'
          $env:PORT='18765'
          $env:SOOP_ENABLE_JAVA_SIDECAR='false'
          $env:SOOP_ENABLE_WRITE_API='false'
          $p = Start-Process node -ArgumentList 'dist/src/index.js' -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i=0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              try { if ((Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18765/readyz' -TimeoutSec 2).StatusCode -eq 200) { $ok=$true; break } } catch {}
            }
            if (-not $ok) { throw 'Core readiness failed' }
            $ws = [System.Net.WebSockets.ClientWebSocket]::new()
            $ct = [Threading.CancellationToken]::None
            $ws.ConnectAsync([Uri]'ws://127.0.0.1:18765/v1/ws',$ct).GetAwaiter().GetResult()
            $buf = New-Object byte[] 8192
            $seg = [ArraySegment[byte]]::new($buf)
            $r = $ws.ReceiveAsync($seg,$ct).GetAwaiter().GetResult()
            $hello = [Text.Encoding]::UTF8.GetString($buf,0,$r.Count) | ConvertFrom-Json
            if ($hello.type -ne 'hello' -or $hello.protocol -ne 4) { throw 'WebSocket protocol 4 hello failed' }
            $ping = [Text.Encoding]::UTF8.GetBytes('{"action":"ping"}')
            $pseg = [ArraySegment[byte]]::new($ping)
            $ws.SendAsync($pseg,[Net.WebSockets.WebSocketMessageType]::Text,$true,$ct).GetAwaiter().GetResult()
            $buf2 = New-Object byte[] 8192
            $r2 = $ws.ReceiveAsync([ArraySegment[byte]]::new($buf2),$ct).GetAwaiter().GetResult()
            $pong = [Text.Encoding]::UTF8.GetString($buf2,0,$r2.Count) | ConvertFrom-Json
            if ($pong.type -ne 'pong') { throw 'WebSocket application heartbeat failed' }
            $ws.Dispose()
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: quiz-overlay/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r quiz-overlay/requirements.txt pyinstaller==6.15.0

      - name: Compile check
        run: >-
          python -m py_compile
          quiz-overlay/common.py
          quiz-overlay/core_runtime.py
          quiz-overlay/quiz_engine_v3.py
          quiz-overlay/quiz_engine_v4.py
          quiz-overlay/quiz_engine_v5.py
          quiz-overlay/soop_client_v3.py
          quiz-overlay/soop_client_v4.py
          quiz-overlay/soop_client_v5.py
          quiz-overlay/overlay_server_v5.py
          quiz-overlay/app_v3.py
          quiz-overlay/app_v31.py
          quiz-overlay/app_v4.py
          quiz-overlay/app_v5.py
          quiz-overlay/test_v5.py
          quiz-overlay/build_v5.py

      - name: Accuracy, tracking and load regression tests
        run: |
          python quiz-overlay/test_engine.py
          python quiz-overlay/test_v3.py
          python quiz-overlay/test_v4.py
          python quiz-overlay/test_v5.py

      - name: Build all-in-one v0.5 EXE
        run: python quiz-overlay/build_v5.py

      - name: End-user EXE smoke and overlay routes
        shell: pwsh
        run: |
          $exe = Resolve-Path 'quiz-overlay/dist-v5/SOOP-Quiz-Overlay-v0.5.0.exe'
          $p = Start-Process $exe -PassThru
          try {
            $overlayOk=$false; $coreOk=$false
            for ($i=0; $i -lt 100; $i++) {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) { throw "EXE exited early: $($p.ExitCode)" }
              try {
                $s = Invoke-RestMethod 'http://127.0.0.1:8765/api/state' -TimeoutSec 2
                $h = Invoke-RestMethod 'http://127.0.0.1:8765/api/health' -TimeoutSec 2
                $quiz = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8765/overlay/quiz' -TimeoutSec 2
                $top3 = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8765/overlay/top3?limit=3' -TimeoutSec 2
                $status = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8765/overlay/status' -TimeoutSec 2
                if ($s.app.version -eq '0.5.0' -and $h.ok -and $quiz.Content -match 'EventSource' -and $quiz.Content -match 'style-neon' -and $top3.StatusCode -eq 200 -and $status.StatusCode -eq 200) { $overlayOk=$true }
              } catch {}
              try { if ((Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18765/readyz' -TimeoutSec 2).StatusCode -eq 200) { $coreOk=$true } } catch {}
              if ($overlayOk -and $coreOk) { break }
            }
            if (-not $overlayOk) { throw 'v0.5 overlay smoke failed' }
            if (-not $coreOk) { throw 'v0.5 embedded Core smoke failed' }
          } finally {
            try { if (-not $p.HasExited) { [void]$p.CloseMainWindow(); Start-Sleep -Seconds 2 } } catch {}
            try { if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } } catch {}
            Start-Sleep -Seconds 1
            Get-NetTCPConnection -LocalPort 18765 -State Listen -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
          }

      - name: Validate EXE
        shell: pwsh
        run: |
          $exe='quiz-overlay/dist-v5/SOOP-Quiz-Overlay-v0.5.0.exe'
          if (-not (Test-Path $exe)) { throw 'EXE missing' }
          $f=Get-Item $exe
          if ($f.Length -lt 10000000) { throw 'EXE unexpectedly small' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Write-Host ('EXE size: {0:N1} MiB' -f ($f.Length/1MB))

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SOOP-Quiz-Overlay-v0.5.0-Windows-AllInOne
          path: quiz-overlay/dist-v5/SOOP-Quiz-Overlay-v0.5.0.exe
          if-no-files-found: error
          retention-days: 14
