name: Build SOOP Quiz Overlay EXE

on:
  push:
    branches:
      - feature/quiz-overlay-draft
    paths:
      - 'quiz-overlay/**'
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/quiz-overlay-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build bundled Unified Core
        shell: pwsh
        run: |
          npm install --no-package-lock
          npm run build

      - name: Smoke bundled Core runtime
        shell: pwsh
        run: |
          $env:HOST='127.0.0.1'
          $env:PORT='18765'
          $env:SOOP_ENABLE_JAVA_SIDECAR='false'
          $env:SOOP_ENABLE_WRITE_API='false'
          $p = Start-Process node -ArgumentList 'dist/src/index.js' -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $r = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18765/readyz' -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw 'Bundled Core readiness smoke failed' }
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Keep production Node dependencies only
        run: npm prune --omit=dev --no-package-lock

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: quiz-overlay/requirements.txt

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r quiz-overlay/requirements.txt pyinstaller==6.15.0

      - name: Compile check
        run: python -m py_compile quiz-overlay/common.py quiz-overlay/quiz_engine.py quiz-overlay/core_runtime.py quiz-overlay/soop_client.py quiz-overlay/overlay_server_v2.py quiz-overlay/app_v2.py quiz-overlay/build_v2.py

      - name: Accuracy regression tests
        run: python quiz-overlay/test_engine.py

      - name: Build all-in-one EXE
        run: python quiz-overlay/build_v2.py

      - name: End-user EXE smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path 'quiz-overlay/dist/SOOP-Quiz-Overlay.exe'
          $p = Start-Process $exe -PassThru
          try {
            $overlayOk = $false
            $coreOk = $false
            for ($i=0; $i -lt 80; $i++) {
              Start-Sleep -Milliseconds 500
              if ($p.HasExited) { throw "Packaged EXE exited early with code $($p.ExitCode)" }
              if (-not $overlayOk) {
                try {
                  $state = Invoke-RestMethod 'http://127.0.0.1:8765/api/state' -TimeoutSec 2
                  if ($state.app.name -eq 'SOOP Quiz Overlay') { $overlayOk = $true }
                } catch {}
              }
              if (-not $coreOk) {
                try {
                  $ready = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:18765/readyz' -TimeoutSec 2
                  if ($ready.StatusCode -eq 200) { $coreOk = $true }
                } catch {}
              }
              if ($overlayOk -and $coreOk) { break }
            }
            if (-not $overlayOk) { throw 'Packaged EXE overlay server did not become ready' }
            if (-not $coreOk) { throw 'Packaged EXE embedded Unified Core did not become ready' }
            Write-Host 'Packaged EXE smoke: UI process + overlay server + embedded Core OK'
          } finally {
            try {
              if (-not $p.HasExited) {
                [void]$p.CloseMainWindow()
                Start-Sleep -Seconds 2
              }
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            } catch {}
            Start-Sleep -Seconds 1
            Get-NetTCPConnection -LocalPort 18765 -State Listen -ErrorAction SilentlyContinue | ForEach-Object {
              Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Validate EXE
        shell: pwsh
        run: |
          $exe = 'quiz-overlay/dist/SOOP-Quiz-Overlay.exe'
          if (-not (Test-Path $exe)) { throw 'EXE missing' }
          $file = Get-Item $exe
          if ($file.Length -lt 10000000) { throw 'EXE unexpectedly small' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Write-Host ('EXE size: {0:N1} MiB' -f ($file.Length / 1MB))

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: SOOP-Quiz-Overlay-Windows-AllInOne
          path: quiz-overlay/dist/SOOP-Quiz-Overlay.exe
          if-no-files-found: error
          retention-days: 14
