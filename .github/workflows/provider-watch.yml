name: Provider Dependency Watch

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream repository health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failed=0
          repos=(reindeer002/soop getCurrentThread/soopapi zzik2/soop4j taejeong1126/soop.js)
          for repo in "${repos[@]}"; do
            data=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$repo")
            read archived pushed age <<<"$(echo "$data" | python3 -c 'import json,sys,datetime; d=json.load(sys.stdin); p=datetime.datetime.fromisoformat(d["pushed_at"].replace("Z","+00:00")); age=(datetime.datetime.now(datetime.timezone.utc)-p).days; print(str(d["archived"]).lower(), d["pushed_at"], age)')"
            echo "$repo: archived=$archived pushed_at=$pushed age_days=$age"
            if [[ "$repo" != "taejeong1126/soop.js" && "$archived" == "true" ]]; then
              echo "::error title=Critical provider archived::$repo is now archived"
              failed=1
            fi
            if (( age > 365 )); then
              echo "::warning title=Provider appears stale::$repo has not been pushed for $age days"
            fi
          done
          exit $failed
