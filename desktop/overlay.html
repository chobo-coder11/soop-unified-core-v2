<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,'Malgun Gothic',sans-serif}.stage{position:relative;width:100vw;height:100vh}.dock{position:absolute;left:3vw;bottom:4vh;display:flex;gap:14px;align-items:flex-end}.card{width:238px;color:#443550;filter:drop-shadow(0 10px 14px #251e3038)}.chest{position:relative;width:126px;height:92px;margin:0 auto -6px;transform-origin:50% 100%}.lid,.base{position:absolute;left:8px;width:110px;border:5px solid #624231;background:linear-gradient(145deg,#ffc15c,#f28849)}.lid{height:42px;top:4px;border-radius:28px 28px 8px 8px;transform-origin:12px 39px}.base{height:57px;bottom:0;border-radius:8px 8px 19px 19px}.strap{position:absolute;z-index:2;width:24px;height:87px;background:#ffe17b;border:4px solid #74512f;left:51px;top:3px;border-radius:8px}.lock{position:absolute;z-index:3;left:47px;top:47px;width:32px;height:27px;background:#ffdc65;border:4px solid #74512f;border-radius:7px}.face{position:absolute;z-index:4;left:35px;bottom:14px;width:58px;text-align:center;font-size:21px;font-weight:900}.info{background:#fffffff2;border:3px solid #fff;border-radius:17px;padding:13px 15px;box-shadow:0 8px 22px #45395828}.title{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row{display:flex;justify-content:space-between;margin-top:5px;font-size:12px}.track{height:10px;background:#e8deed;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#ff73ae,#8666e6);border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}.card.bump .chest{animation:bump .72s}.card.open .lid{animation:openLid 1.1s forwards}.card.open .chest:after{content:'✨';position:absolute;z-index:8;left:38px;top:-35px;font-size:46px;animation:spark 1.3s}.donation{position:absolute;right:4vw;top:7vh;min-width:300px;padding:15px 18px;background:#fffffff2;border:3px solid #fff;border-radius:18px;color:#443550;box-shadow:0 12px 35px #33264a35;opacity:0;transform:translateX(40px)}.donation.show{animation:pop 3.3s}.donation strong{display:block;font-size:19px;color:#7256d4}.burst{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:#392d4a38;opacity:0;pointer-events:none}.burst.show{opacity:1}.wheel-wrap{text-align:center;transform:scale(.6);opacity:0}.show .wheel-wrap{animation:wheelIn .6s .3s forwards}.wheel{position:relative;width:min(63vh,650px);height:min(63vh,650px);border-radius:50%;border:14px solid #fff4cf;box-shadow:0 0 0 8px #684a34,0 28px 80px #241a3b66;overflow:hidden;background:#8065df}.segments{position:absolute;inset:0;border-radius:50%;transition:background .8s}.labels{position:absolute;inset:0}.label{position:absolute;left:50%;top:50%;width:44%;transform-origin:0 0;color:#fff;font-size:16px;font-weight:900;text-shadow:0 2px 4px #0008;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:16%}.pin{position:absolute;z-index:5;top:-20px;left:50%;transform:translateX(-50%);border-left:24px solid transparent;border-right:24px solid transparent;border-top:62px solid #ff557f;filter:drop-shadow(0 4px 1px #783448)}.winner{margin-top:18px;color:#fff;font-size:36px;font-weight:900;text-shadow:0 4px 10px #372745;background:#ff68a8df;border:5px solid #fff;padding:11px 32px;border-radius:999px;opacity:0}.winner.reveal{animation:winner .65s forwards}.confetti{position:absolute;z-index:20;width:11px;height:19px;animation:fall 2.8s linear forwards}@keyframes bump{0%,100%{transform:none}20%{transform:scale(1.13) rotate(-5deg)}45%{transform:scale(.94) rotate(5deg)}70%{transform:scale(1.04)}}@keyframes openLid{30%{transform:translateY(-8px) rotate(-8deg)}100%{transform:translate(-12px,-32px) rotate(-28deg)}}@keyframes spark{from{opacity:0;transform:scale(.2)}50%{opacity:1;transform:scale(1.3)}to{opacity:0;transform:translateY(-28px)}}@keyframes pop{0%{opacity:0;transform:translateX(40px)}12%,78%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-15px)}}@keyframes wheelIn{to{transform:scale(1);opacity:1}}@keyframes winner{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}@keyframes fall{to{transform:translate(var(--x),105vh) rotate(900deg);opacity:.15}}@media(max-width:900px){.card{width:200px}.dock{gap:9px}.label{font-size:13px}}
</style></head><body><main class="stage"><div class="dock" id="dock"></div><div class="donation" id="donation"></div><div class="burst" id="burst"><div class="wheel-wrap"><div class="pin"></div><div class="wheel" id="wheel"><div class="segments" id="segments"></div><div class="labels" id="labels"></div></div><div class="winner" id="winner"></div></div></div></main><script src="/roulette/overlay.js"></script></body></html>
