<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,'Malgun Gothic',sans-serif}.stage{position:relative;width:100vw;height:100vh}.dock{position:absolute;display:flex;gap:14px;align-items:flex-end}.card{position:relative;width:238px;color:#443550;filter:drop-shadow(0 10px 14px #251e3038)}.box-alert{position:absolute;z-index:9;left:50%;bottom:112px;width:230px;padding:10px 13px;text-align:center;background:#fff;border:4px solid #ffd463;border-radius:18px;color:#49364f;box-shadow:0 9px 24px #35244045;transform:translateX(-50%);animation:alertIn 3.9s ease both}.box-alert:after{content:'';position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);border-left:12px solid transparent;border-right:12px solid transparent;border-top:13px solid #ffd463}.box-alert strong,.box-alert span{display:block;font-size:16px}.box-alert strong{color:#7955d8}.box-alert small{display:block;margin-top:2px;font-weight:800;color:#e65d91}.chest{position:relative;width:126px;height:92px;margin:0 auto -6px;transform-origin:50% 100%}.lid,.base{position:absolute;left:8px;width:110px;border:5px solid #624231;background:linear-gradient(145deg,#ffc15c,#f28849)}.lid{height:42px;top:4px;border-radius:28px 28px 8px 8px;transform-origin:12px 39px}.base{height:57px;bottom:0;border-radius:8px 8px 19px 19px}.strap{position:absolute;z-index:2;width:24px;height:87px;background:#ffe17b;border:4px solid #74512f;left:51px;top:3px;border-radius:8px}.lock{position:absolute;z-index:3;left:47px;top:47px;width:32px;height:27px;background:#ffdc65;border:4px solid #74512f;border-radius:7px}.face{position:absolute;z-index:4;left:35px;bottom:14px;width:58px;text-align:center;font-size:21px;font-weight:900}.info{background:#fffffff2;border:3px solid #fff;border-radius:17px;padding:13px 15px;box-shadow:0 8px 22px #45395828}.title{font-weight:900}.row{display:flex;justify-content:space-between;margin-top:5px;font-size:12px}.track{height:10px;background:#e8deed;border-radius:99px;overflow:hidden;margin-top:8px}.fill{height:100%;background:linear-gradient(90deg,#ff73ae,#8666e6);border-radius:99px;transition:width .7s}.card.bump .chest{animation:bump .72s}.card.open .lid{animation:openLid 1.1s forwards}.card.open .chest:after{content:'✨';position:absolute;z-index:8;left:38px;top:-35px;font-size:46px;animation:spark 1.3s}.donation{position:absolute;right:4vw;top:7vh;min-width:300px;padding:15px 18px;background:#fffffff2;border:3px solid #fff;border-radius:18px;color:#443550;opacity:0}.donation.show{animation:pop 3.3s}.donation strong{display:block;font-size:19px;color:#7256d4}.burst{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#5b4776dd,#231a31ed);opacity:0;pointer-events:none;transition:opacity .25s}.burst.show{opacity:1}.wheel-wrap{text-align:center;transform:scale(.72);opacity:0}.show .wheel-wrap{animation:wheelIn .55s .15s forwards}.spin-title{margin-bottom:18px;color:#fff;font-size:clamp(25px,3vw,42px);font-weight:950;text-shadow:0 5px 14px #160e22}.wheel{position:relative;width:min(76vh,820px);height:min(76vh,820px);border-radius:50%;border:18px solid #fff4cf;box-shadow:0 0 0 10px #684a34,0 0 55px #ffd36988,0 30px 90px #120c1c;overflow:hidden;background:#8065df}.wheel:after{content:'★';position:absolute;z-index:4;left:50%;top:50%;display:grid;place-items:center;width:82px;height:82px;transform:translate(-50%,-50%);border-radius:50%;background:#fff4cf;border:8px solid #684a34;color:#ff649f;font-size:38px}.segments,.labels{position:absolute;inset:0;border-radius:50%}.label{position:absolute;left:50%;top:50%;width:46%;transform-origin:0 0;color:#fff;font-size:clamp(16px,1.7vw,25px);font-weight:950;text-shadow:0 3px 6px #000b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:17%}.pin{position:absolute;z-index:7;top:58px;left:50%;transform:translateX(-50%);border-left:31px solid transparent;border-right:31px solid transparent;border-top:78px solid #ff4778;filter:drop-shadow(0 6px 2px #4d2030)}.winner{margin-top:16px;color:#fff;font-size:42px;font-weight:950;background:#ff68a8df;border:5px solid #fff;padding:11px 32px;border-radius:999px;opacity:0}.winner.reveal{animation:winner .65s forwards}.confetti{position:absolute;z-index:20;width:11px;height:19px;animation:fall 2.8s linear forwards}@keyframes alertIn{0%{opacity:0;transform:translate(-50%,18px) scale(.75)}10%,76%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-12px)}}@keyframes bump{20%{transform:scale(1.13) rotate(-5deg)}45%{transform:scale(.94) rotate(5deg)}}@keyframes openLid{100%{transform:translate(-12px,-32px) rotate(-28deg)}}@keyframes spark{50%{opacity:1;transform:scale(1.3)}to{opacity:0;transform:translateY(-28px)}}@keyframes pop{12%,78%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-15px)}}@keyframes wheelIn{to{transform:scale(1);opacity:1}}@keyframes winner{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}@keyframes fall{to{transform:translate(var(--x),105vh) rotate(900deg);opacity:.15}}
</style></head><body><main class="stage"><div class="dock" id="dock"></div><div class="donation" id="donation"></div><div class="burst" id="burst"><div class="wheel-wrap"><div class="spin-title" id="spinTitle">후원자 추첨</div><div class="pin"></div><div class="wheel" id="wheel"><div class="segments" id="segments"></div><div class="labels" id="labels"></div></div><div class="winner" id="winner"></div></div></div></main><script src="/roulette/overlay.js"></script></body></html>
