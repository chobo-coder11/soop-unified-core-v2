services:
  unified-api:
    build: .
    restart: unless-stopped
    env_file: [.env]
    ports: ["8080:8080"]
    # The Java sidecar is optional at runtime. The native core must still boot and serve when it is unhealthy.
    depends_on:
      - java-sidecar
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  java-sidecar:
    build: ./java-sidecar
    restart: unless-stopped
    expose: ["8091"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
